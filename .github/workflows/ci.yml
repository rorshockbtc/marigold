name: Marigold Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  governance-gate:
    name: 🛡️ UAT Governance Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔒 Execute UAT Enforcer (Architecture Rules)
        run: bash scripts/uat_enforcer.sh .

  type-check:
    name: 🔬 TypeScript Type Verification
    runs-on: ubuntu-latest
    needs: governance-gate
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔬 Verify TypeScript Compilation
        run: npx tsc --noEmit

  lint-and-test:
    name: 🧪 Lint, Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🧹 Execute ESLint & Static Analysis
        run: npm run lint

      - name: 🧬 Execute Full Test Suite (Hooks + Components + Crypto + Linkage)
        run: npm test

      - name: 📊 Generate Coverage Report
        run: npm run test:coverage
        continue-on-error: true

  build:
    name: 🏗️ Production Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🏗️ Verify Next.js Production Build Compilation
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
